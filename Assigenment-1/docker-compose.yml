# Two microservices: the model registry and the prediction API.
# Both containers use /app, regardless of the host operating system or folder location.
# Train through the registry service before starting the API; the host registry is separate.
services:
  registry:
    build: .
    image: fraud-detection:1.0
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: >
      mlflow server --backend-store-uri sqlite:////app/docker-mlflow.db
      --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000 --allowed-hosts "*"
    ports:
      - "127.0.0.1::5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 24

  prediction-api:
    image: fraud-detection:1.0
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MLFLOW_TRACKING_URI: http://registry:5000   # the API asks the registry service for the champion model
      MLFLOW_ARTIFACT_DIR: /app/mlruns
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1::8000"
    depends_on:
      registry:
        condition: service_healthy   # start only when the registry answers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 24
